name: Build Android APK

on:
  push:
    branches: [build/android-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build standalone release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../SGM-Spadafora-Sport-Standalone.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGM-Spadafora-Sport-Standalone-APK
          path: SGM-Spadafora-Sport-Standalone.apk
          if-no-files-found: error
