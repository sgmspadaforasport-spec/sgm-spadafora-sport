<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foto Staff | Admin SGM</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(1180px,94%);margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.top h1{margin:0;text-transform:uppercase}.top a{color:#ffd400;text-decoration:none;font-weight:800}.note{color:#aaa;font-size:13px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#111;border:1px solid #2b2b2b;border-radius:16px;overflow:hidden}.photo{aspect-ratio:4/5;background:#222 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#777;text-transform:uppercase;font-size:11px;font-weight:900}.body{padding:16px}.body h3{margin:0 0 5px;font-size:18px}.body p{margin:0 0 14px;color:#999;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,label.btn{display:inline-block;border:0;border-radius:9px;padding:10px 12px;font-weight:900;cursor:pointer;background:#ffd400;color:#000;font-size:12px}.btn.dark,label.btn.dark{background:#222;color:#fff;border:1px solid #3a3a3a}.status{margin:18px 0;color:#aee6a3;font-size:13px}.saving{opacity:.6;pointer-events:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>Foto Staff</h1><div class="note">Carica o sostituisci la foto di ogni componente. Le modifiche vengono salvate online.</div></div><a href="admin.html">← Torna al pannello admin</a></div><div id="status" class="status"></div><div id="grid" class="grid"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-data.js"></script><script>const people=[['Mons. Alessandro Lo Nardo','Presidente'],['Simone Scibilia','Vicepresidente'],['Aldo Ciuna','Segretario'],['Maria Ialacqua','Tesoriere'],['Luca Scibilia','Consigliere e dirigente delegato calcio a 5'],['Carmelo Floridia','Consigliere e dirigente delegato pallavolo'],['Adriano Piccione','Consigliere e dirigente delegato basket'],['Domenico Cannuli','Consigliere'],['Andrea Scibilia','Ufficio economico-amministrativo'],['Alessandro Scibilia','Social Media Manager'],['Andrea Giacobbo','Allenatore calcio a 5'],['Antonio Romeo','Allenatore dei portieri calcio a 5'],['Antonio Vitale','Dirigente calcio a 5'],['Pippo Arcoraci','Dirigente calcio a 5'],['Gabriele Marchetta','Allenatore pallavolo maschile'],['Giuseppe Cangemi','Dirigente pallavolo maschile'],['Andrea Sapienza','Dirigente pallavolo maschile'],['Dario Alberti','Allievo allenatore pallavolo'],['Antonio Barbera','Allenatore basket'],['Giuliano Anastasi','Assistente allenatore basket']];let data={};function slug(n){return n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function draw(){const photos=data.generalStaffPhotos||{};document.getElementById('grid').innerHTML=people.map(([name,role])=>{const s=slug(name),url=photos[s]||'';return `<article class="card" data-slug="${s}"><div class="photo" style="${url?`background-image:url('${url}')`:''}">${url?'':'Foto non inserita'}</div><div class="body"><h3>${name}</h3><p>${role}</p><div class="actions"><label class="btn">Carica foto<input type="file" accept="image/jpeg,image/png,image/webp" hidden data-upload="${s}"></label><button class="btn dark" data-remove="${s}">Rimuovi foto</button></div></div></article>`}).join('');document.querySelectorAll('[data-upload]').forEach(i=>i.addEventListener('change',e=>upload(e.target.dataset.upload,e.target.files[0])));document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>removePhoto(b.dataset.remove)))}async function persist(){document.body.classList.add('saving');document.getElementById('status').textContent='Salvataggio...';try{await window.SGM_DB.saveSiteData(data);document.getElementById('status').textContent='Salvato online ✓'}catch(e){document.getElementById('status').textContent='Errore: '+e.message}finally{document.body.classList.remove('saving')}}async function upload(s,file){if(!file)return;document.getElementById('status').textContent='Caricamento immagine...';try{const url=await window.SGM_DB.uploadImage(file,'staff');data.generalStaffPhotos=data.generalStaffPhotos||{};data.generalStaffPhotos[s]=url;await persist();draw()}catch(e){document.getElementById('status').textContent='Errore caricamento: '+e.message}}async function removePhoto(s){data.generalStaffPhotos=data.generalStaffPhotos||{};delete data.generalStaffPhotos[s];await persist();draw()}(async()=>{await window.SGM_DB.init();if(!window.SGM_DB.enabled){location.href='login.html';return}const session=await window.SGM_DB.getSession();if(!session){location.href='login.html';return}try{data=await window.SGM_DB.getSiteData()||{};draw()}catch(e){document.getElementById('status').textContent='Errore: '+e.message}})();</script></body></html>
