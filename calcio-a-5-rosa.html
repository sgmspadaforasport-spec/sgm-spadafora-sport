<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Rosa Calcio a 5 ASD SGM Spadafora Sport">
<title>Rosa Calcio a 5 | ASD SGM Spadafora Sport</title>
<link rel="stylesheet" href="style.css?v=102">
<style>
.roster-hero{padding:64px 0 34px;background:#111;color:#fff;border-bottom:4px solid #ffd400}
.roster-hero h1{margin:0;font-size:clamp(38px,7vw,72px);line-height:.95}
.roster-hero p{max-width:720px;color:#c8c8c8}
.roster-section{padding:44px 0 60px;background:#f5f5f5}
.roster-group{margin:0 0 46px}.roster-group:last-child{margin-bottom:0}
.roster-kicker{margin:0 0 8px;color:#b08f00;font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
.roster-title{margin:0 0 18px;color:#111;font-size:clamp(28px,5vw,40px);font-weight:900;text-transform:uppercase}
.roster-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.player-card{display:flex;align-items:center;gap:16px;background:#111;color:#fff;border:1px solid #292929;border-radius:14px;padding:18px;min-height:96px}
.player-number{width:64px;height:64px;flex:0 0 64px;display:grid;place-items:center;background:#ffd400;color:#000;border-radius:12px;font-size:28px;font-weight:900}
.player-info h3{margin:0 0 4px;font-size:19px;line-height:1.15}.player-info p{margin:0;color:#aaa;font-size:12px;font-weight:900;text-transform:uppercase}
.roster-note{margin-top:22px;color:#777;font-size:11px}.dynamic-back{padding:28px 0 50px}
@media(max-width:850px){.roster-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.roster-grid{grid-template-columns:1fr}.player-card{padding:15px}.player-number{width:58px;height:58px;flex-basis:58px;font-size:25px}}
</style>
</head>
<body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img class="brand-logo" src="IMG-20250217-WA0006.jpg" alt="Logo ASD SGM Spadafora Sport"><div class="brand-text"><strong>ASD SGM</strong><span>Spadafora Sport</span></div></a><button class="menu-toggle" aria-label="Apri menu" aria-expanded="false"><span></span><span></span><span></span></button><nav class="main-nav"><a href="index.html">Home</a><a href="squadre.html">Squadre</a><a href="rose.html">Rose</a><a href="staff.html">Staff</a><a href="calendario-risultati.html">Calendario</a><a href="news.html">News</a><a href="sponsor.html">Sponsor</a><a href="galleria.html">Galleria</a><a href="sgm-tv.html">SGM TV</a><a href="palmares.html">Palmarès</a><a href="contatti.html">Contatti</a></nav></div></header>
<main>
<section class="roster-hero"><div class="container"><p class="section-kicker yellow">STAGIONE SPORTIVA 2026/2027</p><h1>ROSA<br>CALCIO A 5</h1><p>Prima squadra ASD SGM Spadafora Sport.</p></div></section>
<section class="roster-section"><div class="container"><div id="rosterRoot"></div><p class="roster-note" id="rosterNote"></p></div></section>
<section class="dynamic-back"><div class="container"><a class="btn btn-primary" href="calcio-a-5.html">← Torna a Calcio a 5</a></div></section>
</main>
<footer class="footer"><div class="container"><img class="footer-logo" src="IMG-20250217-WA0006.jpg" alt="Logo ASD SGM Spadafora Sport"></div><div class="container footer-wrap"><p>© 2026 ASD SGM Spadafora Sport</p><p>Stagione sportiva 2026/2027 · 🖤💛</p></div><div style="text-align:center;background:#080808;padding:0 0 18px"><a href="admin.html" style="font-size:9px;color:#555">Area amministratore</a></div></footer>
<script src="supabase-config.js"></script>
<script>
(function(){
  const fallbackRoster = [
    {number:1,name:'Vittorio Molino',role:'Portiere'},
    {number:29,name:'Roberto Filorano',role:'Portiere'},
    {number:2,name:'Andrea Scibilia',role:'Difensore'},
    {number:4,name:'Antonio De Vita',role:'Difensore'},
    {number:7,name:'Sebastiano Lombardo',role:'Laterale'},
    {number:10,name:'Salvatore Scibilia',role:'Laterale · Capitano'},
    {number:11,name:'Salvatore Formica',role:'Laterale'},
    {number:16,name:'Marco Centorrino',role:'Laterale'},
    {number:24,name:'Cristian Lombardo',role:'Laterale'},
    {number:9,name:'Rosario Grasso',role:'Pivot'},
    {number:20,name:'Simone Abate',role:'Pivot'},
    {number:32,name:'Alessio Crisafulli',role:'Pivot'},
    {number:45,name:'Giuseppe Vitrano',role:'Pivot'}
  ];

  const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  function groupRole(role){
    const r=String(role||'').toLowerCase();
    if(r.includes('portier')) return 'PORTIERI';
    if(r.includes('difensor')||r.includes('centrale')) return 'DIFENSORI';
    if(r.includes('laterale')&&r.includes('pivot')) return 'LATERALI / PIVOT';
    if(r.includes('laterale')) return 'LATERALI';
    if(r.includes('pivot')) return 'PIVOT';
    return 'GIOCATORI';
  }
  const order=['PORTIERI','DIFENSORI','LATERALI','LATERALI / PIVOT','PIVOT','GIOCATORI'];
  function render(roster){
    const root=document.getElementById('rosterRoot');
    const groups={};
    (roster||[]).forEach(p=>{const g=groupRole(p.role);(groups[g]||(groups[g]=[])).push(p)});
    root.innerHTML=order.filter(g=>groups[g]?.length).map(g=>`<section class="roster-group"><p class="roster-kicker">CALCIO A 5</p><h2 class="roster-title">${esc(g)}</h2><div class="roster-grid">${groups[g].map(p=>`<article class="player-card"><div class="player-number">${esc(p.number ?? 'SGM')}</div><div class="player-info"><h3>${esc(p.name||'')}</h3><p>${esc(p.role||'')}</p></div></article>`).join('')}</div></section>`).join('');
  }
  render(fallbackRoster);

  async function refreshFromSupabase(){
    const cfg=window.SGM_SUPABASE_CONFIG||{};
    if(!cfg.url||!cfg.anonKey) return;
    try{
      const res=await fetch(cfg.url+'/rest/v1/site_data?id=eq.1&select=payload',{
        headers:{apikey:cfg.anonKey,Authorization:'Bearer '+cfg.anonKey,Accept:'application/json'}
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const rows=await res.json();
      const live=rows?.[0]?.payload?.sports?.calcio_a_5?.roster;
      if(Array.isArray(live)&&live.length){render(live);document.getElementById('rosterNote').textContent='';}
    }catch(e){
      console.warn('Rosa online non disponibile, uso copia locale.',e);
    }
  }

  document.addEventListener('DOMContentLoaded',()=>{
    refreshFromSupabase();
    const t=document.querySelector('.menu-toggle'),m=document.querySelector('.main-nav');
    if(!t||!m)return;
    const close=()=>{m.classList.remove('menu-open');t.setAttribute('aria-expanded','false')};
    t.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const open=m.classList.toggle('menu-open');t.setAttribute('aria-expanded',open?'true':'false')});
    m.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));
    document.addEventListener('click',e=>{if(!m.contains(e.target)&&!t.contains(e.target))close()});
  });
})();
</script>
</body>
</html>
