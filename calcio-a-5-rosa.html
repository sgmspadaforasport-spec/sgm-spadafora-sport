<!doctype html>
<html lang="it">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Rosa Calcio a 5 ASD SGM Spadafora Sport">

<title>Rosa Calcio a 5 | ASD SGM Spadafora Sport</title>

<link rel="stylesheet" href="style.css?v=100">


<style>

/* =========================
   HERO
========================= */

.dynamic-hero{
  padding:64px 0 34px;
  background:#111;
  color:#fff;
  border-bottom:4px solid var(--yellow);
}

.dynamic-hero h1{
  margin:0;
  font-size:clamp(38px,7vw,72px);
  line-height:.95;
}

.dynamic-hero p{
  max-width:720px;
  color:#c8c8c8;
}


/* =========================
   SEZIONE ROSA
========================= */

.roster-section{
  padding:48px 0 58px;
  background:#f5f5f5;
}

.roster-group{
  margin-bottom:55px;
}

.roster-group:last-child{
  margin-bottom:0;
}

.roster-kicker{
  margin:0 0 12px;
  color:#e7b900;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.roster-title{
  margin:0 0 26px;
  color:#111;
  font-size:clamp(32px,6vw,48px);
  line-height:1;
  font-weight:900;
  text-transform:uppercase;
}


/* =========================
   GRIGLIA
========================= */

.roster-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}


/* =========================
   SCHEDA GIOCATORE
========================= */

.player-card{
  display:flex;
  align-items:center;
  gap:18px;

  background:#111;
  color:#fff;

  border:1px solid #292929;
  border-radius:18px;

  padding:20px;

  min-height:105px;
}


/* NUMERO */

.player-number{
  width:72px;
  height:72px;

  flex:0 0 72px;

  display:grid;
  place-items:center;

  background:var(--yellow);
  color:#000;

  border-radius:16px;

  font-size:29px;
  font-weight:900;
}


/* DATI */

.player-info{
  min-width:0;
}

.player-info h3{
  margin:0 0 7px;

  color:#fff;

  font-size:21px;
  line-height:1.15;
  font-weight:900;
}

.player-info p{
  margin:0;

  color:#aaa;

  font-size:13px;
  font-weight:900;

  text-transform:uppercase;
}


/* =========================
   MESSAGGIO VUOTO
========================= */
