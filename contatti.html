<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Informazioni e recapiti della società.">
  <title>Contatti | ASD SGM Spadafora Sport</title>
  <link rel="stylesheet" href="style.css?v=123">
  <style>
    .contacts-hero{padding:72px 0 54px;background:#111;color:#fff;border-bottom:4px solid var(--yellow)}
    .contacts-hero h1{margin:0;font-size:clamp(46px,8vw,84px);line-height:.92;font-weight:900}
    .contacts-hero p:last-child{max-width:760px;color:#c7c7c7;font-size:17px;margin-top:16px}
    .contacts-section{padding:58px 0;background:#f5f5f5}
    .contacts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    .contact-card{background:#fff;border:1px solid #e2e2e2;border-radius:18px;padding:26px;box-shadow:0 12px 30px rgba(0,0,0,.06)}
    .contact-card h2{margin:0 0 16px;font-size:26px}
    .contact-label{display:block;color:#8a7200;font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;margin-bottom:6px}
    .contact-value,.contact-card a{font-size:17px;font-weight:800;overflow-wrap:anywhere}
    .contact-row{padding:12px 0;border-bottom:1px solid #ececec}
    .contact-row:last-child{border-bottom:0}
    .social-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
    .social-grid a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;background:#111;color:#fff;font-size:14px;font-weight:900}
    .social-grid a:hover{background:var(--yellow);color:#000}
    .contacts-empty{padding:42px;border:1px dashed #bbb;border-radius:16px;text-align:center;background:#fff;color:#777;grid-column:1/-1}
    @media(max-width:760px){.contacts-grid{grid-template-columns:1fr}.social-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img class="brand-logo" src="IMG-20250217-WA0006.jpg" alt="Logo ASD SGM Spadafora Sport"><div class="brand-text"><strong>ASD SGM</strong><span>Spadafora Sport</span></div></a><button class="menu-toggle" aria-label="Apri menu" aria-expanded="false"><span></span><span></span><span></span></button><nav class="main-nav"><a href="index.html">Home</a><a href="squadre.html">Squadre</a><a href="rose.html">Rose</a><a href="staff.html">Staff</a><a href="calendario-risultati.html">Calendario</a><a href="news.html">News</a><a href="sponsor.html">Sponsor</a><a href="galleria.html">Galleria</a><a href="sgm-tv.html">SGM TV</a><a href="palmares.html">Palmarès</a><a href="contatti.html">Contatti</a></nav></div></header>
<main>
  <section class="contacts-hero"><div class="container"><p class="section-kicker yellow">ASD SGM SPADAFORA SPORT</p><h1>CONTATTI</h1><p>Informazioni, recapiti e canali ufficiali della società.</p></div></section>
  <section class="contacts-section"><div class="container"><div id="contactsGrid" class="contacts-grid"><div class="contacts-empty">Caricamento contatti...</div></div></div></section>
</main>
<footer class="footer"><div class="container"><img class="footer-logo" src="IMG-20250217-WA0006.jpg" alt="Logo ASD SGM Spadafora Sport"></div><div class="container footer-wrap"><p>© 2026 ASD SGM Spadafora Sport</p><p>Stagione sportiva 2026/2027 · 🖤💛</p></div><div style="text-align:center;background:#080808;padding:0 0 18px"><a href="admin.html" style="font-size:9px;color:#555">Area amministratore</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-data.js?v=7"></script>
<script src="site-data.js?v=7"></script>
<script>
function esc(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function safeUrl(value){const u=String(value||'').trim();return /^https?:\/\//i.test(u)?u:'#';}
function getContacts(data){return (data&&data.contacts)||(data&&data.contatti)||(data&&data.contact)||{};}
function renderContactsFromData(data){
  const c=getContacts(data);
  const grid=document.getElementById('contactsGrid');
  if(!grid)return;
  const hasAny=Boolean(c.address||c.email||c.pec||c.facebook||c.instagram||c.tiktok||c.twitch);
  if(!hasAny){grid.innerHTML='<div class="contacts-empty">Nessun contatto ancora pubblicato.</div>';return;}
  const recapiti=`<article class="contact-card"><h2>Recapiti</h2>
    ${c.address?`<div class="contact-row"><span class="contact-label">Sede legale</span><div class="contact-value">${esc(c.address)}</div></div>`:''}
    ${c.email?`<div class="contact-row"><span class="contact-label">Email</span><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>`:''}
    ${c.pec?`<div class="contact-row"><span class="contact-label">PEC</span><a href="mailto:${esc(c.pec)}">${esc(c.pec)}</a></div>`:''}
  </article>`;
  const socials=[['Facebook',c.facebook],['Instagram',c.instagram],['TikTok',c.tiktok],['Twitch',c.twitch]].filter(item=>item[1]);
  const social=`<article class="contact-card"><h2>Social</h2>${socials.length?`<div class="social-grid">${socials.map(([name,url])=>`<a href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${esc(name)}</a>`).join('')}</div>`:'<p>Nessun canale social inserito.</p>'}</article>`;
  grid.innerHTML=recapiti+social;
}
async function fallbackLoadContacts(){
  try{
    if(window.SGM_SITE_DATA){renderContactsFromData(window.SGM_SITE_DATA);return;}
    if(!window.SGM_DB)return;
    const ready=await window.SGM_DB.init();
    if(!ready)return;
    const data=await window.SGM_DB.getSiteData();
    renderContactsFromData(data||{});
  }catch(e){console.warn('Errore caricamento contatti',e);}
}
document.addEventListener('sgm-data-ready',event=>renderContactsFromData(event.detail||{}));
document.addEventListener('DOMContentLoaded',()=>{
  const toggle=document.querySelector('.menu-toggle'),menu=document.querySelector('.main-nav');
  if(toggle&&menu){const close=()=>{menu.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false')};toggle.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const open=menu.classList.toggle('menu-open');toggle.setAttribute('aria-expanded',open?'true':'false')});menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!toggle.contains(e.target))close()});window.addEventListener('resize',()=>{if(window.innerWidth>768)close()});}
  setTimeout(fallbackLoadContacts,250);
});
</script>
</body>
</html>
