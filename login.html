<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin | ASD SGM Spadafora Sport</title>
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,rgba(255,212,0,.12),transparent 25%),#070707;color:#fff}
.login-box{width:min(430px,92%);padding:34px;border:1px solid #2b2b2b;border-radius:20px;background:#111}
.login-box img{width:78px;height:78px;object-fit:contain;border-radius:12px;background:#fff;display:block;margin:0 auto 20px}
.login-box h1{text-align:center;text-transform:uppercase;font-size:30px}
.login-box>p{text-align:center;color:#999;margin:8px 0 24px}
.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:10px;color:#aaa;font-weight:900;text-transform:uppercase}
.field input{background:#090909;border:1px solid #333;color:#fff;border-radius:9px;padding:13px;font:inherit}
button{width:100%;border:0;border-radius:9px;padding:13px;background:#ffd400;color:#000;font-weight:900;cursor:pointer;margin-top:6px}
.error{color:#ff8a8a;font-size:12px;margin-top:12px;text-align:center}
.back{display:block;text-align:center;margin-top:18px;font-size:11px;color:#aaa}
</style>
</head>
<body>
<form class="login-box" id="loginForm">
<img src="assets/logo-sgm.jpg" alt="ASD SGM Spadafora Sport">
<h1>Area Amministratore</h1>
<p>Accedi per aggiornare il sito ufficiale.</p>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button type="submit">Accedi</button>
<div class="error" id="error"></div>
<a class="back" href="index.html">← Torna al sito</a>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-data.js"></script>
<script>
(async()=>{
  await window.SGM_DB.init();
  if(await window.SGM_DB.getSession()) location.href='admin.html';
})();
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const error=document.getElementById('error'); error.textContent='';
  try{
    if(!window.SGM_DB.enabled) throw new Error('Supabase non configurato');
    await window.SGM_DB.signIn(
      document.getElementById('email').value,
      document.getElementById('password').value
    );
    location.href='admin.html';
  }catch(err){
    error.textContent = err.message === 'Supabase non configurato'
      ? 'Area admin non ancora configurata.'
      : 'Email o password non corrette.';
  }
});
</script>
</body>
</html>
