<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Login Admin | ASD SGM Spadafora Sport</title>


<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(255,212,0,.12),
      transparent 25%
    ),
    #070707;
  color:#fff;
}

.login-box{
  width:min(430px,92%);
  padding:34px;
  border:1px solid #2b2b2b;
  border-radius:20px;
  background:#111;
}

.login-box img{
  width:78px;
  height:78px;
  object-fit:contain;
  border-radius:12px;
  background:#fff;
  display:block;
  margin:0 auto 20px;
}

.login-box h1{
  text-align:center;
  text-transform:uppercase;
  font-size:30px;
  margin:0;
}

.login-box > p{
  text-align:center;
  color:#999;
  margin:8px 0 24px;
}

.field{
  display:grid;
  gap:7px;
  margin-bottom:14px;
}

.field label{
  font-size:10px;
  color:#aaa;
  font-weight:900;
  text-transform:uppercase;
}

.field input{
  width:100%;
  background:#090909;
  border:1px solid #333;
  color:#fff;
  border-radius:9px;
  padding:13px;
  font:inherit;
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:13px;
  background:#ffd400;
  color:#000;
  font-weight:900;
  cursor:pointer;
  margin-top:6px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  color:#ff8a8a;
  font-size:12px;
  margin-top:12px;
  text-align:center;
  line-height:1.45;
}

.success{
  color:#9bd18b;
  font-size:12px;
  margin-top:12px;
  text-align:center;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  font-size:11px;
  color:#aaa;
  text-decoration:none;
}

.back:hover{
  color:#ffd400;
}

</style>

</head>


<body>


<form class="login-box" id="loginForm">

<img
  src="IMG-20250217-WA0006.jpg"
  alt="ASD SGM Spadafora Sport"
>


<h1>
  Area Amministratore
</h1>


<p>
  Accedi per aggiornare il sito ufficiale.
</p>


<div class="field">

<label for="email">
  Email
</label>

<input
  id="email"
  type="email"
  autocomplete="username"
  required
>

</div>


<div class="field">

<label for="password">
  Password
</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
  required
>

</div>


<button
  id="loginButton"
  type="submit"
>
  Accedi
</button>


<div
  class="error"
  id="error"
></div>


<div
  class="success"
  id="success"
></div>


<a
  class="back"
  href="index.html"
>
  ← Torna al sito
</a>

</form>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="supabase-data.js"></script>



<script>

document.addEventListener(
  "DOMContentLoaded",
  async function () {

    const form =
      document.getElementById(
        "loginForm"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const errorBox =
      document.getElementById(
        "error"
      );

    const successBox =
      document.getElementById(
        "success"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );


    function showError(message){

      successBox.textContent = "";

      errorBox.textContent =
        message || "Accesso non riuscito.";

    }


    function showSuccess(message){

      errorBox.textContent = "";

      successBox.textContent =
        message || "";

    }


    /*
      Inizializzazione Supabase
    */

    try {

      if (
        !window.SGM_DB ||
        typeof window.SGM_DB.init !== "function"
      ) {

        throw new Error(
          "SGM_DB non disponibile"
        );

      }


      const ready =
        await window.SGM_DB.init();


      if (!ready) {

        throw new Error(
          "Supabase non configurato correttamente"
        );

      }


      /*
        Se esiste già una sessione,
        vai direttamente all'Admin
      */

      const session =
        await window.SGM_DB.getSession();


      if (session) {

        location.href =
          "admin.html";

        return;

      }


    } catch (err) {

      console.error(
        "Errore inizializzazione Supabase:",
        err
      );


      showError(
        "Errore configurazione: " +
        (err.message || "Supabase non disponibile")
      );

    }



    /*
      LOGIN
    */

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        errorBox.textContent = "";

        successBox.textContent = "";


        const email =
          emailInput.value
            .trim()
            .toLowerCase();


        const password =
          passwordInput.value;


        if (!email) {

          showError(
            "Inserisci l'indirizzo email."
          );

          return;

        }


        if (!password) {

          showError(
            "Inserisci la password."
          );

          return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Accesso in corso...";


        try {

          /*
            Riinizializza Supabase
            prima del login
          */

          const ready =
            await window.SGM_DB.init();


          if (!ready) {

            throw new Error(
              "Supabase non configurato"
            );

          }


          const result =
            await window.SGM_DB.signIn(
              email,
              password
            );


          console.log(
            "Login Supabase riuscito:",
            result
          );


          const session =
            await window.SGM_DB.getSession();


          if (!session) {

            throw new Error(
              "Sessione non creata dopo il login"
            );

          }


          showSuccess(
            "Accesso riuscito. Apertura area amministratore..."
          );


          setTimeout(
            function () {

              location.href =
                "admin.html";

            },
            400
          );


        } catch (err) {

          console.error(
            "ERRORE LOGIN SUPABASE:",
            err
          );


          const message =
            err?.message ||
            "Accesso non riuscito";


          /*
            Mostriamo il vero errore
            restituito da Supabase.
          */

          showError(
            "Errore: " + message
          );


          loginButton.disabled = false;

          loginButton.textContent =
            "Accedi";

        }

      }
    );

  }
);

</script>


</body>

</html>
