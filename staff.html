<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Direttivo e staff ASD SGM Spadafora Sport."><title>Staff | ASD SGM Spadafora Sport</title>
<link rel="stylesheet" href="style.css?v=116">
<style>
.staff-hero{padding:64px 0 38px;background:#111;color:#fff;border-bottom:4px solid var(--yellow)}.staff-hero h1{margin:0;font-size:clamp(42px,7vw,76px);line-height:.95;font-weight:900}.staff-hero p:last-child{max-width:760px;color:#c8c8c8;margin-top:16px}.staff-section{padding:52px 0;background:#f5f5f5}.staff-section.alt{background:#fff}.staff-section-head{margin-bottom:24px}.staff-section-head h2{margin:0;font-size:clamp(30px,5vw,48px);line-height:1;font-weight:900;text-transform:uppercase}.staff-section-head p{margin:9px 0 0;color:#777}.staff-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.staff-grid.single{grid-template-columns:minmax(240px,360px)}.staff-card{overflow:hidden;background:#111;color:#fff;border:1px solid #292929;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.staff-photo{aspect-ratio:4/5;background:#080808 center/cover no-repeat}.staff-card-body{padding:17px 18px 20px}.staff-card-body span{display:block;color:var(--yellow);font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}.staff-card h3{margin:0 0 7px;font-size:20px;line-height:1.15}.staff-card p{margin:0;color:#aaa;font-size:12px;font-weight:800;text-transform:uppercase;line-height:1.4}@media(max-width:1050px){.staff-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.staff-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.staff-grid,.staff-grid.single{grid-template-columns:1fr}.staff-section{padding:40px 0}}
</style></head><body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img class="brand-logo" src="IMG-20250217-WA0006.jpg" alt="Logo ASD SGM Spadafora Sport"><div class="brand-text"><strong>ASD SGM</strong><span>Spadafora Sport</span></div></a><button class="menu-toggle" aria-label="Apri menu" aria-expanded="false"><span></span><span></span><span></span></button><nav class="main-nav"><a href="index.html">Home</a><a href="squadre.html">Squadre</a><a href="rose.html">Rose</a><a href="staff.html">Staff</a><a href="calendario-risultati.html">Calendario</a><a href="news.html">News</a><a href="sponsor.html">Sponsor</a><a href="galleria.html">Galleria</a><a href="sgm-tv.html">SGM TV</a><a href="palmares.html">Palmarès</a><a href="contatti.html">Contatti</a></nav></div></header><main>
<section class="staff-hero"><div class="container"><p class="section-kicker yellow">ASD SGM SPADAFORA SPORT</p><h1>STAFF<br>SOCIETARIO</h1><p>Direttivo, amministrazione, comunicazione e staff sportivo della stagione 2026/2027.</p></div></section>
<div id="staff-content"></div></main>
<footer class="footer"><div class="container"><img class="footer-logo" src="IMG-20250217-WA0006.jpg" alt="Logo ASD SGM Spadafora Sport"></div><div class="container footer-wrap"><p>© 2026 ASD SGM Spadafora Sport</p><p>Stagione sportiva 2026/2027 · 🖤💛</p></div></footer>
<script>
const groups=[['SOCIETÀ','Direttivo',[['presidente','Mons. Alessandro Lo Nardo','Presidente'],['vicepresidente','Simone Scibilia','Vicepresidente'],['segretario','Aldo Ciuna','Segretario'],['tesoriere','Maria Ialacqua','Tesoriere'],['consigliere','Luca Scibilia','Consigliere e dirigente delegato calcio a 5'],['consigliere','Carmelo Floridia','Consigliere e dirigente delegato pallavolo'],['consigliere','Adriano Piccione','Consigliere e dirigente delegato basket'],['consigliere','Domenico Cannuli','Consigliere']]],['AMMINISTRAZIONE','Ufficio economico-amministrativo',[['amministrazione','Andrea Scibilia','Ufficio economico-amministrativo']]],['COMUNICAZIONE','Social Media Manager',[['comunicazione','Alessandro Scibilia','Social Media Manager']]],['AREA SPORTIVA','Calcio a 5',[['calcio a 5','Andrea Giacobbo','Allenatore calcio a 5'],['calcio a 5','Antonio Romeo','Allenatore dei portieri calcio a 5'],['calcio a 5','Antonio Vitale','Dirigente calcio a 5'],['calcio a 5','Pippo Arcoraci','Dirigente calcio a 5']]],['AREA SPORTIVA','Pallavolo',[['pallavolo','Gabriele Marchetta','Allenatore pallavolo maschile'],['pallavolo','Giuseppe Cangemi','Dirigente pallavolo maschile'],['pallavolo','Andrea Sapienza','Dirigente pallavolo maschile'],['pallavolo','Dario Alberti','Allievo allenatore pallavolo']]],['AREA SPORTIVA','Basket',[['basket','Antonio Barbera','Allenatore basket'],['basket','Giuliano Anastasi','Assistente allenatore basket']]]];
const personPos={'Mons. Alessandro Lo Nardo':0,'Simone Scibilia':1,'Aldo Ciuna':2,'Maria Ialacqua':3,'Luca Scibilia':4,'Carmelo Floridia':5,'Adriano Piccione':6,'Domenico Cannuli':7,'Andrea Scibilia':8,'Alessandro Scibilia':9,'Andrea Giacobbo':10,'Antonio Romeo':11,'Antonio Vitale':12,'Pippo Arcoraci':13,'Gabriele Marchetta':14,'Giuseppe Cangemi':15,'Andrea Sapienza':16,'Dario Alberti':17,'Antonio Barbera':18,'Giuliano Anastasi':19};
function card(p){const i=personPos[p[1]],x=i%4,y=Math.floor(i/4);return `<article class="staff-card"><div class="staff-photo" data-x="${x}" data-y="${y}"></div><div class="staff-card-body"><span>${p[0]}</span><h3>${p[1]}</h3><p>${p[2]}</p></div></article>`}
document.getElementById('staff-content').innerHTML=groups.map((g,i)=>`<section class="staff-section ${i%2?'alt':''}"><div class="container"><div class="staff-section-head"><p class="section-kicker yellow">${g[0]}</p><h2>${g[1]}</h2></div><div class="staff-grid ${g[2].length===1?'single':''}">${g[2].map(card).join('')}</div></div></section>`).join('');
function loadPhotos(){const img=new Image();img.onload=()=>{document.querySelectorAll('.staff-photo').forEach(el=>{const x=+el.dataset.x,y=+el.dataset.y;const sw=img.width/4,sh=img.height/5;const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=400;c.height=500;ctx.drawImage(img,x*sw,y*sh,sw,sh,0,0,400,500);el.style.backgroundImage=`url(${c.toDataURL('image/jpeg',.9)})`})};img.src='images/staff/staff-sprite-fixed.jpg?v=116'}
document.addEventListener('DOMContentLoaded',()=>{const toggle=document.querySelector('.menu-toggle'),menu=document.querySelector('.main-nav');if(toggle&&menu){const close=()=>{menu.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false')};toggle.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const open=menu.classList.toggle('menu-open');toggle.setAttribute('aria-expanded',open?'true':'false')});menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!toggle.contains(e.target))close()})}loadPhotos()});
</script></body></html>
